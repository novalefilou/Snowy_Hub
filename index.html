<div id="snowyy-lock" class="hidden" style="
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  padding:20px;
">
  <div style="
    width:min(420px,100%);
    background:#11131b;
    color:white;
    border:1px solid #ffffff20;
    border-radius:24px;
    padding:30px;
    text-align:center;
    box-shadow:0 30px 100px #000;
  ">

    <div style="font-size:45px">🔐</div>

    <h2 style="margin:10px 0">
      Vérification Snowyy
    </h2>

    <p style="color:#aeb4c4;margin-bottom:20px">
      Entre le mot de passe supplémentaire pour continuer.
    </p>

    <input
      id="snowyy-password"
      type="password"
      placeholder="Mot de passe"
      style="
        width:100%;
        padding:14px;
        border-radius:12px;
        border:1px solid #ffffff20;
        background:#080a10;
        color:white;
        outline:none;
        margin-bottom:10px;
      "
    >

    <button
      class="primary"
      onclick="unlockSnowyy()"
      style="width:100%"
    >
      🔓 Continuer
    </button>

    <p id="snowyy-error" style="
      color:#ff6b81;
      margin-top:12px;
      min-height:20px;
    "></p>

  </div>
</div>
